[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "boomrate2"
version = "0.0.1.dev0"
description = "GPU-accelerated supernova control-time and volumetric rate calculations with multi-filter selection."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Christa DeCoursey" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
# CUDA 12 build of CuPy; install with `pip install boomrate2[gpu]`.
gpu = ["cupy-cuda12x[ctk]>=13"]
test = ["pytest>=8", "pytest-cov>=5"]
docs = ["sphinx>=7", "myst-parser>=3", "furo>=2024.1"]
dev = ["boomrate2[test,docs]", "ruff>=0.6", "pre-commit>=3"]

[project.urls]
Repository = "https://github.com/cndecoursey/BoomRate2"

[tool.hatch.build.targets.wheel]
packages = ["src/boomrate2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires CuPy and a CUDA-capable GPU (skipped otherwise)",
    "slow: long-running end-to-end tests",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.coverage.run]
source = ["boomrate2"]
